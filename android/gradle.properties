org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# AGP 9 ships a new DSL and built-in Kotlin support; Flutter's template opts out
# of both so plugins keep using Kotlin Gradle Plugin and the legacy DSL.
android.newDsl=false
android.builtInKotlin=false

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// ---------------------------------------------------------------------------
// Release signing.
//
// Signing material is NEVER committed. The CI workflow decodes the keystore
// from repository secrets into android/app/upload-keystore.jks and writes
// android/key.properties. Local builds can do the same manually.
//
// Required key.properties entries:
//   storeFile=upload-keystore.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// ---------------------------------------------------------------------------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}

android {
    namespace "com.eyeswatchinggames.no_tide_back"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // Must match android/app/google-services.json and MainActivity.kt package.
        applicationId "com.eyeswatchinggames.no_tide_back"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                def storeFilePath = keystoreProperties["storeFile"] ?: "upload-keystore.jks"
                storeFile rootProject.file("app/${storeFilePath}")
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Falls back to debug signing only when no keystore is supplied,
            // so `flutter build apk` still works for quick smoke tests.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            ndk {
                debugSymbolLevel "none"
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt"]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.20"

    // Xsolla Android SDK (optional). Enable with: flutter build apk -PwithXsolla
    // The Kotlin bridge in MainActivity only touches these classes when invoked.
    if (project.hasProperty("withXsolla")) {
        implementation "com.xsolla.android:login:3.1.0"
        implementation "com.xsolla.android:payments:3.1.0"
        implementation "com.xsolla.android:store:3.1.0"
    }
}

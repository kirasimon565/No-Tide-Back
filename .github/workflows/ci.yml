name: CI

# Fast feedback: analyze + tests on every push and pull request.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          set +e
          flutter pub get 2>&1 | tee /tmp/pub-get.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the resolver output as check annotations so failures are
            # readable straight from the pull request / commit view.
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=pub get::${line}"
            done < <(grep -iaE 'because|version solving|incompatible|failed|depends on|sdk' /tmp/pub-get.log | head -30)
            exit "$status"
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test --reporter expanded

  script-validation:
    name: Validate .ntb scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Unknown asset references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, re, sys

          referenced = set()
          for path in sorted(glob.glob('assets/scripts/*.ntb')):
              text = open(path, encoding='utf-8').read()
              referenced |= set(re.findall(r'([A-Za-z0-9_\-]+\.(?:jpg|png|mp4|mp3|ogg|webm|gif))', text))

          on_disk = {os.path.basename(p) for p in glob.glob('assets/**/*', recursive=True) if os.path.isfile(p)}
          missing = sorted(referenced - on_disk)
          print(f'{len(referenced)} referenced media files, {len(missing)} missing')
          if missing:
              print('\n'.join(f'  MISSING: {m}' for m in missing))
              sys.exit(1)
          PY

      - name: Labels and gotos resolve
        run: |
          python3 - <<'PY'
          import glob, re, sys

          labels, gotos = set(), []
          for path in sorted(glob.glob('assets/scripts/*.ntb')):
              for number, line in enumerate(open(path, encoding='utf-8'), start=1):
                  stripped = line.strip()
                  if stripped.startswith('::'):
                      labels.add(stripped[2:].strip())
                  elif stripped.startswith('@goto'):
                      target = stripped.split(None, 1)[1].strip() if ' ' in stripped else ''
                      gotos.append((path, number, target))

          unresolved = [g for g in gotos if g[2] not in labels]
          print(f'{len(labels)} scenes, {len(gotos)} gotos, {len(unresolved)} unresolved')
          for path, number, target in unresolved:
              print(f'  {path}:{number} -> {target}')
          sys.exit(1 if unresolved else 0)
          PY

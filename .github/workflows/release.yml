name: Release APK

# Publishes a signed APK to a GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Uses the same keystore secrets as build-apk.yml.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required for a release build."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }} \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number ${{ github.run_number }}

      - name: Build universal APK
        run: |
          flutter build apk --release \
            --dart-define=REVENUECAT_ANDROID_KEY=${{ secrets.REVENUECAT_ANDROID_KEY }} \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number ${{ github.run_number }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: No Tide Back ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
          body: |
            **No Tide Back — Episode 1: The Contract**

            Package: `com.eyeswatchinggames.no_tide_back`

            Install the universal APK if you are unsure which ABI your device needs.
            Purchases and saves are tied to your Google account, so progress follows
            you across devices.

      - name: Clean signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

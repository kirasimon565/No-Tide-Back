name: Probe dependency resolution

# Temporary diagnostic: prints the real pub resolver output for the pinned
# dependency set. Deleted once the package versions are locked in.

on:
  workflow_dispatch:
  push:
    paths:
      - 'pubspec.yaml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show error via annotations
        run: |
          set +e
          flutter --version
          flutter pub get 2>&1 | tee /tmp/pub.log
          status=${PIPESTATUS[0]}
          echo "EXIT=$status" > /tmp/status
          # annotate only resolver-relevant lines (the banner noise is ignored)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=pub::${line}"
          done < <(grep -iaE 'because|error|version solving|sdk|constraint|incompatible|failed|depends on|not found' /tmp/pub.log | head -40)
          exit 0

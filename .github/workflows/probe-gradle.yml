name: Probe Gradle
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build with app-level logging
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons -v > /tmp/build.log 2>&1
          status=$?
          echo "build exit=$status"
          # Persist the tail of the log as an artifact-friendly summary
          {
            echo '```'
            grep -aE 'e: |error:|ERROR|FAILURE|What went wrong|Caused by|> Task .* FAILED|Unresolved reference|Cannot|not found|missing' /tmp/build.log | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=gradle::${line}"
          done < <(grep -aE 'e: |error:|FAILURE:|What went wrong|Caused by|> Task .* FAILED|Unresolved reference' /tmp/build.log | tail -40)
          exit 0
